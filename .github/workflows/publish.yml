name: Build, verify and publish computer image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: computer-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/yodyodlabs/yodyod-computer-image

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build linux/amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Validate size and run real VM-runtime smoke tests
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE:ci-$GITHUB_SHA"
          bytes=$(docker image inspect "$image" --format '{{.Size}}')
          test "$bytes" -lt 15000000000
          bash scripts/smoke-test.sh "$image"
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          source="$IMAGE:ci-$GITHUB_SHA"
          immutable="$IMAGE:sha-$GITHUB_SHA"
          docker tag "$source" "$immutable"
          docker push "$immutable"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
            docker tag "$source" "$IMAGE:$version"
            docker push "$IMAGE:$version"
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag "$source" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          digest=$(docker image inspect "$immutable" --format '{{index .RepoDigests 0}}')
          {
            echo '### Published and verified'
            echo "\`$immutable\`"
            echo
            echo "\`$digest\`"
            echo
            echo 'Desktop, shared Chrome, all three MCP servers, Codex app-server handshake,'
            echo 'nested Docker, Unicode input and restart persistence passed without model credentials.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain failed desktop screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
